name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Verify delayed deployment
        if: steps.deploy.outcome == 'failure'
        env:
          LIVE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$LIVE_URL" | cmp --silent dist/index.html -; then
              exit 0
            fi
            sleep 10
          done
          exit 1
